  <circle cx="200" cy="400" r="220" fill="#4f46e5" fill-opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="240" fill="#10b981" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
